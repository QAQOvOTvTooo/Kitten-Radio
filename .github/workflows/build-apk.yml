name: Build Kitten-Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - liquid-glass-ui

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull material-color-utilities submodule
        run: |
          rm -rf material3/material-color-utilities
          git clone https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities
          cd material3/material-color-utilities
          git checkout 6fd88eb3e95ba1d457842e2a2bf847d06b3a018a || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js & pnpm (for web-ui)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and web-ui dependencies
        run: |
          npm install -g pnpm
          if [ -d "web-ui" ] && [ -f "web-ui/package.json" ]; then
            cd web-ui && pnpm install
          fi

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Generate and Permanently Lock Kitten-Radio Keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "app/kitten_home.keystore.b64" ] && [ ! -f "app/kitten_home.keystore" ]; then
            base64 -d app/kitten_home.keystore.b64 > app/kitten_home.keystore
            echo "Restored locked kitten_home.keystore from app/kitten_home.keystore.b64"
          fi
          if [ ! -f "app/kitten_home.keystore" ]; then
            keytool -genkeypair -v \
              -keystore app/kitten_home.keystore \
              -storepass mianmian520 \
              -alias linhe_mianmian \
              -keypass mianmian520 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=LinHe and MianMian,OU=KittenRadio,O=OurHome,C=CN"
            base64 -w 0 app/kitten_home.keystore > app/kitten_home.keystore.b64
            git config user.name "LinHe"
            git config user.email "linhe@kittenradio.home"
            git add -f app/kitten_home.keystore app/kitten_home.keystore.b64
            git commit -m "chore(sign): 永久锁定小猫电台专属签名证书 kitten_home.keystore [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kitten-Radio-APK
          path: app/build/outputs/apk/debug/*.apk
